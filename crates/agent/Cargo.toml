[package]
name = "agent"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
shared = { path = "../shared" }
tokio = { workspace = true, features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging"] }
tokio-tungstenite = "0.29.0"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower-http = { workspace = true, features = ["fs", "cors"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "service", "tokio"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }
